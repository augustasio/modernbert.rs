[workspace]
resolver = "2"
members = [
    "crates/mb-tokenizer",
    "crates/mb-model",
    "crates/mb-harness",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Tokenizer: Unicode general-category tables. `char::is_alphabetic()`
# is not `\p{L}` and must never stand in for it.
unicode-general-category = "1.0"
# NFC normalization. The tables are large and the canonical ordering rules are
# fiddly; writing this by hand would be transcription, not insight.
unicode-normalization = "0.1"
serde_json = "1.0"

# Test oracles and test-data handling only. These must never appear outside
# dev-dependencies.
fancy-regex = "0.17"
flate2 = "1.1"

# Tests run the real forward pass, and rung 6's naive matmul is unusably slow
# unoptimized: one 963-token fixture would take most of an hour. opt-level 3
# without lto keeps both run time and compile memory reasonable on a 16 GB
# machine. Benchmarks still use the release profile below.
[profile.test]
opt-level = 3

# Optimize for the machine being benchmarked. Set in .cargo/config.toml so it applies
# uniformly to every crate, keeping the rungs comparable.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

# Long evaluation runs, such as all 7,600 AG News examples. Optimized like
# release but without fat LTO, which costs gigabytes to compile on a 16 GB
# machine that is usually running other work at the same time. Not for
# benchmarks: those use the release profile.
[profile.eval]
inherits = "release"
lto = false
codegen-units = 16
