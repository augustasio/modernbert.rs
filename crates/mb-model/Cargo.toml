[package]
name = "mb-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ModernBERT forward pass, written from scratch"

[dependencies]
mb-tokenizer = { path = "../mb-tokenizer" }
serde_json = { workspace = true }

[features]
# Rung 7: route ops::linear through Apple Accelerate's cblas_sgemm. Off by
# default, so the default build is rung 6, the naive loop.
accelerate = []
# Rung 8: the binaries run the fused, allocation-free forward pass in
# `fused.rs`. The matmul stays rung 7's Accelerate, so this needs it.
fused = ["accelerate"]
# Rung 9: `exp` in the softmax and in `erf` is the f32 polynomial in
# `expf.rs`, which vectorises, instead of f64 libm `exp`. Built on rung 8.
expf = ["fused"]
