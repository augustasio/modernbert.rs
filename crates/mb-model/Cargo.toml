[package]
name = "mb-model"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ModernBERT forward pass, written from scratch"

[dependencies]
mb-tokenizer = { path = "../mb-tokenizer" }
serde_json = { workspace = true }

[features]
# Rung 7: route ops::linear through Apple Accelerate's cblas_sgemm. Off by
# default, so the default build is rung 6, the naive loop.
accelerate = []
# Rung 8: the binaries run the fused, allocation-free forward pass in
# `fused.rs`. The matmul stays rung 7's Accelerate, so this needs it.
fused = ["accelerate"]
# Rung 9: `exp` in the softmax and in `erf` is the f32 polynomial in
# `expf.rs`, which vectorises, instead of f64 libm `exp`. Built on rung 8.
expf = ["fused"]
# Rung 10: the two attention products, `Q K^T` and `P V`, go through
# `cblas_sgemm` per head, as PyTorch's CPU attention does, instead of rung
# 8's hand loops. Built on rung 9.
attention-sgemm = ["expf"]
# Rung 11: the work outside the big matmuls (attention per head, the norms,
# the residual adds and the GELU gate) is split across `MB_THREADS` threads,
# as PyTorch splits it across its OpenMP pool. Built on rung 10, with the
# same arithmetic.
threads = ["attention-sgemm"]
# Rung 12: the arithmetic still in f64 (erf in GELU, the LayerNorm mean and
# variance, the softmax total) moves to f32, as PyTorch computes it, with lane
# sums so that large values do not swamp small ones. Built on rung 11.
f32-math = ["threads"]
# Rung 13: loading moves each tensor out of the checkpoint into the model
# instead of cloning it, so only one f32 copy of the weights ever exists. The
# forward pass is rung 12's. Built on rung 12.
owned-weights = ["f32-math"]
# Rung 14: the worker accepts batches, run through the batched forward pass
# without padding (`ModernBert::logits_batch_fused`). A batch of one is rung
# 13's path. Built on rung 13.
batch = ["owned-weights"]
# Rung 15: the last layer runs only at the mask rows. It is global, so its
# keys and values still come from every token, but only the mask query is
# read by the head, so the attention output, `Wo`, the norm and the MLP run
# on one row per sequence. Built on rung 14.
mask-rows = ["batch"]
# Rung 16 is no new feature: it is `mask-rows` built on Linux x86, where
# `accelerate.rs` links Intel MKL's `cblas_sgemm` instead, as PyTorch does.
# So on Linux every feature above that says Accelerate means MKL.
# Rung 17: the linear layers (Wqkv, Wo, Wi, the MLP's Wo and head.dense) run
# as bf16 matmuls through oneDNN (`onednn.rs`), with f32 sums. Only the
# activations entering them are rounded; the weights are the checkpoint's own
# bf16. Links `libdnnl`. Built on rung 15 (16 on Linux).
bf16 = ["mask-rows"]
# Rung 18: MKL runs serial inside the attention threads. Each head's Q K^T and
# P V already runs on a thread of ours; a threaded MKL there starts one more
# OpenMP team per thread of ours, so t threads become about t squared. PyTorch
# has no such trap, because its attention runs inside one OpenMP pool and MKL
# goes serial inside a parallel region. No effect on macOS. Built on rung 17.
serial-blas = ["bf16"]
# Rung 19: the threads of ours come from the same OpenMP pool that oneDNN and
# MKL use, as PyTorch does, instead of being spawned for each piece of work.
# Links `libgomp`, Linux only; on macOS the spawned threads stay. Built on
# rung 18.
omp-pool = ["serial-blas"]
# Rung 20: the same five linear layers as rung 17, in s8 with s32 sums through
# oneDNN: weights with a scale per output column, activations with a scale per
# row, computed on each call. Built on rung 19.
int8 = ["omp-pool"]
# Rung 22: s8 only for the MLP's Wi and the attention's Wo, the two kinds whose
# rounding moved the logits least when measured one at a time against rung 0
# (760 examples, no labels). Wi is also the largest matmul. Wqkv, the MLP's
# Wo and head.dense stay bf16. Built on rung 20, with its quantize and
# dequantize loops on the pool.
int8-partial = ["int8"]
# Rung 23: Wqkv and the MLP's Wo join rung 22's s8 layers, smoothed first
# (SmoothQuant, alpha 0.5): each input channel is divided by a scale s_j and
# the weight's column multiplied by it, with s_j from rung 0's activations on
# 512 train-split prompts (`python/smooth_calibrate.py`). head.dense stays
# bf16. Built on rung 22.
int8-smooth = ["int8-partial"]
# Rung 24: the s8 matmuls take their input as u8 (s8 + 128), the type x86's
# VNNI instruction multiplies by s8, and take 128 * sum(w) off each sum. The
# s32 sums are exact either way, so the logits are rung 23's, bit for bit.
# Built on rung 23.
int8-u8 = ["int8-smooth"]
# Rung 25: the largest-value searches in the softmax and the int8 row scales
# keep 16 running maxima, one per lane, so they vectorise. A maximum is exact
# in any order, so the logits are rung 24's, bit for bit. Built on rung 24.
# Measured slower (results/bench/cloud_turin_serve25): a negative result,
# kept; later rungs build on rung 24, not on this.
lane-max = ["int8-u8"]
# Rung 26: Wqkv, Wi and the MLP's Wo take their s8 (u8) input already rounded
# by the row loop that computes it (the norms and the GELU gate), instead of a
# separate pass inside the matmul. The same rounding on the same values, so
# the logits are rung 24's, bit for bit. Built on rung 24, not on rung 25.
fuse-quant = ["int8-u8"]
# Rung 27: the attention products Q K^T and P V of every layer but the last
# as oneDNN bf16 matmuls with f32 sums, in place of MKL's f32 sgemm; Q, K, V
# and the probabilities are rounded to bf16 on the way in. Built on rung 26.
attn-bf16 = ["fuse-quant"]
# Rung 28: the attention scatter (RoPE on Q and K, the head layout) writes Q,
# K and V in bf16 straight into the buffers the two products read, instead of
# f32 copies that a second pass rounds and transposes. Rung 27's logits, bit
# for bit. Built on rung 27.
scatter-bf16 = ["attn-bf16"]
# Rung 29: the attention softmax writes P rounded to bf16 straight into the
# buffer `P V` reads, instead of f32 probabilities that a second pass rounds.
# Rung 28's logits, bit for bit. Built on rung 28; needs rung 12's f32 math.
softmax-bf16 = ["scatter-bf16", "f32-math"]
# Rung 30: the int8 rounding (round to nearest even, then s8 or u8) by adding
# 1.5 * 2^23 in f32 and keeping the low byte, which vectorises; the saturating
# `as i8` cast compiled to scalar code. The same integer for every value the
# scales allow, so rung 28's logits, bit for bit. Built on rung 28.
round-simd = ["scatter-bf16"]
# Rung 31: `exp_f32` builds 2^n with the same 1.5 * 2^23 shift instead of the
# saturating `n as i32` cast, which compiled to scalar code inside every loop
# over `exp` (the GELU gate's erf and the softmax). The same 2^n for every n
# the clamp allows, so rung 30's logits, bit for bit. Built on rung 30.
exp-simd = ["round-simd"]
# Analysis only, never a rung: wall time per stage of the threaded layer,
# printed at the end of `eval_agnews` (`stage_times.rs`).
stage-times = []
